<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Animes do Betoro-chan</title>
<meta name="description" content="A lista de animes, mangás e novels do Betoro-chan e da galera.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8200f'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial Black,sans-serif' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app" data-cat="anime">
  <header class="top topbar">
    <a href="/animes" data-link>
      <p class="eyebrow">ベトロちゃん</p>
      <h1>Lista de Animes do <span>Betoro-chan</span></h1>
    </a>
  </header>
  <div class="me auth" id="me"></div>

  <section id="home">
    <nav class="cats" id="cats" role="tablist" aria-label="Categoria"></nav>
    <div class="searchbox" id="searchbox" style="margin-top:16px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="q" id="q" type="search" autocomplete="off" placeholder="Buscar anime…" aria-label="Buscar ou adicionar">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div id="newform" style="margin-top:16px"></div>
    <div class="bar" style="margin-top:16px">
      <div class="seg" id="seg" role="tablist" aria-label="Visão"></div>
      <button class="btn" id="addbtn" type="button" hidden>+ Adicionar</button>
    </div>
    <div class="filters" id="filters" style="margin-top:12px"></div>
    <ul class="cards" id="list" style="margin-top:12px"></ul>
    <div id="morebox" style="display:flex;justify-content:center;margin-top:12px"></div>
  </section>

  <section class="wv" id="wv" hidden></section>
  <p class="note" id="note"></p>
</div>

<div class="sheet-bg" id="sheetbg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-grip" aria-hidden="true"></div>
  <header class="sheet-head" id="sheethead"></header>
  <div class="sheet-body" id="chat"></div>
  <form class="composer" id="composer">
    <div class="composer-in">
      <div class="replying" id="replying" hidden></div>
      <div class="cpreview" id="cpreview" hidden></div>
      <div class="crow">
        <label class="cbtn" id="cimgbtn" for="cimg" title="Anexar imagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></label>
        <input type="file" id="cimg" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <textarea id="cmsg" rows="1" maxlength="1000" placeholder="Escreva um comentário…" aria-label="Mensagem"></textarea>
        <button class="csend" id="csend" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </form>
  <p class="sheet-ro" id="sheetro" hidden>Para comentar, <button class="link" type="button" data-login>entre na sua conta</button>.</p>
</div>

<div class="gate" id="gate" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
