<title>Lista de Animes do Betoro-chan</title>
<script>
  // O GitHub Pages não conhece endereços como /anime/frieren.
  // Esta página manda a pessoa para a página principal levando o endereço junto.
  var l = window.location;
  l.replace(l.origin + "/?p=" + encodeURIComponent(l.pathname + l.search) + l.hash);
</script>
